services:
  framewise:
    build: .
    container_name: framewise
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据目录（字幕、索引、对话记录不会因容器重启丢失）
      - ./data:/app/data
      # 配置文件（API Key 等）
      - ./.env:/app/.env
      # 后端代码（热重载，用轮询监听）
      - ./backend:/app/backend
    restart: unless-stopped
    dns:
      - 114.114.114.114
      - 8.8.8.8
    environment:
      - TZ=Asia/Shanghai
      - FFMPEG_PATH=ffmpeg
      # 轮询式文件监听，解决 Windows/WSL2 挂载卷 inotify 报错
      - WATCHFILES_FORCE_POLLING=true
